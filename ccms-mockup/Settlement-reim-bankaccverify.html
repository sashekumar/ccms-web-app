        :root {

            --accent-blue: #0d6efd;
            --bg-gray: #f0f2f5;
            --border-color: #d1d5db;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 0.72rem;
        }

        /* --- Header / Tabs --- */
        .header-bar {
            background: white;
            padding: 0.3rem 1.2rem 0 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            flex-shrink: 0;
        }

        .nav-tabs {
            border-bottom: none;
            gap: 2px;
        }

        .nav-tabs .nav-link {
            border: 1px solid transparent;
            border-bottom: none;
            padding: 0.35rem 0.6rem;
            color: #475569;
            font-weight: 500;
            font-size: 0.73rem;
            background: #f8fafc;
            border-radius: 4px 4px 0 0;
            border: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        .nav-tabs .nav-link.active {
            background: white;
            color: var(--accent-blue);
            border-color: #e2e8f0;
            border-bottom: 2px solid white;
            margin-bottom: -2px;
            font-weight: 700;
            z-index: 5;
        }

        /* --- Workspace --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Grid Controls --- */
        .grid-controls {
            padding: 0.4rem 1rem;
            background: #fdfdfd;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .search-by-text {
            font-size: 0.7rem;
            color: #444;
            margin-right: 5px;
        }

        .blue-go {
            color: #2563eb;
            font-weight: 700;
            cursor: pointer;
            margin-left: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        /* --- Table Styling --- */
        .table-wrap {
            flex: 1;
            overflow: auto;
            background: #9ca3af;
            /* Gray background from screenshot */
        }

        .custom-grid {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
        }

        .custom-grid thead th {
            background: white;
            padding: 0.4rem 0.6rem;
            font-weight: 600;
            color: #1e293b;
            text-transform: uppercase;
            font-size: 0.65rem;
            border-right: 1px solid #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
            position: sticky;
            top: 0;
            z-index: 20;
            white-space: nowrap;
        }

        .custom-grid tbody td {
            padding: 0.4rem 0.6rem;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
            vertical-align: middle;
            background: white;
            font-size: 0.68rem;
            color: #333;
        }

        .row-alt {
            background-color: #f8fafc;
        }

        /* --- UI Elements --- */
        .search-select {
            padding: 0.15rem 0.3rem;
            font-size: 0.7rem;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            min-width: 150px;
        }

        .search-box {
            width: 120px;
            padding: 0.15rem 0.3rem;
            font-size: 0.7rem;
            border: 1px solid var(--border-color);
            margin-left: 2px;
        }

        .record-count {
            color: #2563eb;
            font-style: italic;
            font-weight: 700;
            font-size: 0.7rem;
        }

        .clickable {
            cursor: pointer;
        }

        .text-xs {
            font-size: 0.65rem;
        }

        .btn-verify {
            padding: 2px 8px;
            font-size: 0.65rem;
            font-weight: 600;
            border-radius: 3px;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border: 2px solid #f1f5f9;
            border-radius: 5px;
        }
    </style>
</head>

            btn.classList.remove('btn-primary');
