<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incomplete Document Reminder | CCMS</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #1e3c72;
            --accent-blue: #2563eb;
            --bg-gray: #f0f2f5;
            --border-color: #cbd5e1;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 0.72rem;
        }

        /* --- Header / Tabs --- */
        .header-bar {
            background: white;
            padding: 0.3rem 1.2rem 0 1.2rem;
            border-bottom: 2px solid #e2e8f0;
            flex-shrink: 0;
        }

        .nav-tabs {
            border-bottom: none;
            gap: 2px;
        }

        .nav-tabs .nav-link {
            border: 1px solid transparent;
            border-bottom: none;
            padding: 0.35rem 0.8rem;
            color: #475569;
            font-weight: 500;
            font-size: 0.72rem;
            background: #f8fafc;
            border-radius: 4px 4px 0 0;
            border: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        .nav-tabs .nav-link.active {
            background: white;
            color: var(--accent-blue);
            border-color: #e2e8f0;
            border-bottom: 2px solid white;
            margin-bottom: -2px;
            font-weight: 700;
            z-index: 5;
        }

        /* --- Workspace --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Grid Controls --- */
        .grid-controls {
            padding: 0.4rem 1rem;
            background: #fdfdfd;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .search-by-text {
            font-size: 0.7rem;
            color: #444;
            margin-right: 5px;
        }

        .blue-go {
            color: #2563eb;
            font-weight: 700;
            cursor: pointer;
            margin-left: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        /* --- Table Styling --- */
        .table-wrap {
            flex: 1;
            overflow: auto;
            background: #9ca3af;
        }

        .custom-grid {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
        }

        .custom-grid thead th {
            background: white;
            padding: 0.4rem 0.6rem;
            font-weight: 600;
            color: #1e293b;
            text-transform: uppercase;
            font-size: 0.65rem;
            border-right: 1px solid #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
            position: sticky;
            top: 0;
            z-index: 20;
            white-space: nowrap;
        }

        .custom-grid tbody td {
            padding: 0.4rem 0.6rem;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
            vertical-align: middle;
            background: white;
            font-size: 0.68rem;
            color: #333;
        }

        .row-alt {
            background-color: #f8fafc;
        }

        .row-selected {
            background-color: #e0f2fe !important;
        }

        /* --- UI Elements --- */
        .search-select {
            padding: 0.15rem 0.3rem;
            font-size: 0.7rem;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            min-width: 150px;
        }

        .search-box {
            width: 120px;
            padding: 0.15rem 0.3rem;
            font-size: 0.7rem;
            border: 1px solid var(--border-color);
            margin-left: 2px;
        }

        .record-count {
            color: #2563eb;
            font-style: italic;
            font-weight: 700;
            font-size: 0.7rem;
        }

        .clickable {
            cursor: pointer;
        }

        .text-xs {
            font-size: 0.65rem;
        }

        .link-action {
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
        }

        .link-action:hover {
            color: #1d4ed8;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border: 2px solid #f1f5f9;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <!-- TOP NAV / TABS -->
    <header class="header-bar d-flex justify-content-between align-items-end">
        <ul class="nav nav-tabs" id="reminderTabs">
            <li class="nav-item">
                <button class="nav-link active" onclick="switchTab('Requirement Letter', this)">Requirement
                    Letter</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('First Reminder', this)">First Reminder</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('Second Reminder', this)">Second Reminder</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('Third Reminder', this)">Third Reminder</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('Final Reminder', this)">Final Reminder</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('Closed Reminder', this)">Closed Reminder</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('Report', this)">Report</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="switchTab('Pending Printing', this)">Pending Printing</button>
            </li>
        </ul>
    </header>

    <!-- CONTENT -->
    <div class="workspace">
        <div class="grid-controls">
            <div class="d-flex align-items-center">
                <span class="search-by-text">Search By :</span>
                <select class="search-select">
                    <option value="claim">CLAIM FILENO</option>
                    <option value="patient">PATIENT NAME</option>
                    <option value="ic">PATIENT IC</option>
                </select>
                <input type="text" class="search-box">
                <span class="blue-go">GO..</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="record-count" id="recordCountText">71 records</span>
                <div class="d-flex align-items-center gap-1 clickable" title="Export to Excel">
                    <img src="https://img.icons8.com/color/20/microsoft-excel-2019.png" alt="Excel">
                    <span class="text-xs">Export</span>
                </div>
            </div>
        </div>

        <div class="table-wrap">
            <table class="custom-grid">
                <thead>
                    <tr>
                        <th></th>
                        <th>CLAIM FILENO</th>
                        <th>REG REFNO</th>
                        <th>MODE</th>
                        <th>ADMISSION TYPE</th>
                        <th>DATE DISABILITY</th>
                        <th>PATIENT IC</th>
                        <th>PATIENT NAME</th>
                        <th>PH IC</th>
                        <th>PH NAME</th>
                        <th>PH MOBILE</th>
                        <th>REMINDER STATUS</th>
                        <th>DATE REMINDER</th>
                        <th>DURATION</th>
                        <th>RE-PRINT</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="reminderGridBody">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

                { claim: "R/2025/10/5537", reg: "RE/211250", mode: "REIM", type: "POST", date: "9/22/2025 10:29 AM", pIc: "190527040296", pName: "NAURA NUR TIHANI BINTI MOHAMAD AKHIR", phIc: "C791007015138", phName: "ANI BINTI JAFFRI", mobile: "017-6676201", status: "REQUIREMENT LETTER", dateRem: "", duration: "" },

                { claim: "R/2025/11/5904", reg: "RE/212382", mode: "REIM", type: "PRE", date: "10/16/2025 5:21 PM", pIc: "C760408135825", pName: "KAMAL BIN REJELI", phIc: "C760408135825", phName: "KAMAL BIN REJELI", mobile: "0126740159", status: "REQUIREMENT LETTER", dateRem: "", duration: "" },
                { claim: "R/2025/11/5759", reg: "RE/211969", mode: "REIM", type: "IP", date: "9/24/2025 9:43 AM", pIc: "C870816085641", pName: "MOHAMAD ASHRAF BIN ABDUL HALIM", phIc: "C870816085641", phName: "MOHAMAD ASHRAF BIN ABDUL HALIM", mobile: "0125868658", status: "REQUIREMENT LETTER", dateRem: "", duration: "" },

                { claim: "R/2025/08/4170", reg: "RE/206167", mode: "REIM", type: "DAYCARE", date: "7/21/2025 11:49 AM", pIc: "C790507015578", pName: "MUSLIHA BINTI MOHD SHOODI @ SUHADI", phIc: "C790507015578", phName: "MUSLIHA BINTI MOHD SHOODI @ SUHADI", mobile: "0196675578", status: "REQUIREMENT LETTER", dateRem: "", duration: "" },
                { claim: "R/2025/11/6084", reg: "RE/212977", mode: "REIM", type: "POST", date: "6/14/2025 9:36 AM", pIc: "820708085702", pName: "NURUL KHUZAIMAH BINTI MD SALLEH", phIc: "C780731086339", phName: "NOOR ARZUAN BIN LENAN", mobile: "0124517739", status: "REQUIREMENT LETTER", dateRem: "", duration: "" },
                { claim: "R/2025/10/5639", reg: "RE/211571", mode: "REIM", type: "IP", date: "10/4/2025 1:05 PM", pIc: "C710424075222", pName: "NORLIZA BINTI ISMAIL", phIc: "C710424075222", phName: "NORLIZA BINTI ISMAIL", mobile: "0164329375", status: "REQUIREMENT LETTER", dateRem: "", duration: "" },
            ],
            "First Reminder": [

                { claim: "R/2025/10/5181", reg: "RE/209769", mode: "REIM", type: "POST", date: "8/20/2025 5:42 PM", pIc: "890424055236", pName: "NURNADIAH BINTI ZAINAL ARIF", phIc: "C891212025229", phName: "MOHAMAD SYAFIQ BIN MOHAMAD NAJIB", mobile: "0125858921", status: "FIRST REMINDER", dateRem: "", duration: "" },
                { claim: "R/2025/10/5643", reg: "RE/211580", mode: "REIM", type: "IP", date: "9/24/2025 2:54 PM", pIc: "BY16428", pName: "MOHAMAD ALIMI BIN MOHD SHAMSUDDIN", phIc: "C700508035499", phName: "MOHD SHAMSUDDIN BIN OMAR", mobile: "0199878467", status: "FIRST REMINDER", dateRem: "", duration: "" },
            ],
            "Second Reminder": [
                { claim: "R/2025/09/4588", reg: "RE/207644", mode: "REIM", type: "DCA", date: "7/20/2025 9:36 AM", pIc: "C630504025751", pName: "ABD GHAFAR BIN SAMSU", phIc: "C630504025751", phName: "ABD GHAFAR BIN SAMSU", mobile: "0176198506", status: "SECOND REMINDER", dateRem: "", duration: "" },
                { claim: "R/2025/09/4684", reg: "RE/207909", mode: "REIM", type: "POST", date: "6/17/2025 3:06 PM", pIc: "090710160095", pName: "MUHAMMAD AZMIE ARIB BIN AZZEMI", phIc: "C720707055576", phName: "JUNAIDAH BINTI MAT JIDIN", mobile: "0193851415", status: "SECOND REMINDER", dateRem: "", duration: "" },
            ]
        };

        let currentTab = "Requirement Letter";

        function switchTab(tabName, el) {
            currentTab = tabName;

            // UI Update
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            renderGrid();
        }

        function renderGrid() {
            const tbody = document.getElementById('reminderGridBody');
            tbody.innerHTML = '';

            const data = sampleData[currentTab] || [];
            document.getElementById('recordCountText').innerText = `${data.length} records`;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="16" class="text-center py-4 bg-white">No records found for this reminder stage.</td></tr>';
                return;
            }

            data.forEach((item, i) => {
                const tr = document.createElement('tr');
                if (i % 2 !== 0) tr.className = 'row-alt';
                if (i === data.length - 1 && currentTab === "Requirement Letter") tr.className += ' row-selected'; // Mock selection

                tr.innerHTML = `
                    <td class="text-center"><i class="fas fa-caret-right text-muted"></i></td>
                    <td>${item.claim}</td>
                    <td>${item.reg}</td>
                    <td>${item.mode}</td>
                    <td>${item.type}</td>
                    <td>${item.date}</td>
                    <td>${item.pIc}</td>
                    <td>${item.pName}</td>
                    <td>${item.phIc}</td>
                    <td>${item.phName}</td>
                    <td>${item.mobile}</td>
                    <td>${item.status}</td>
                    <td>${item.dateRem}</td>
                    <td>${item.duration}</td>
                    <td class="text-center"><span class="link-action">Re-Print</span></td>
                    <td class="text-center"><span class="link-action">Update Reminder</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = renderGrid;
    </script>
</body>

</html>
