<!-- Fixed Top Navbar - CCMS Mockup Style with Sidebar Toggle -->
<nav class="fixed top-0 left-0 right-0 bg-white border-b border-gray-200 shadow-sm z-50 h-[60px] px-4 sm:px-6 flex items-center justify-between">
  <!-- Left: Sidebar Toggle + Brand Logo + Role Badge -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Sidebar Toggle Button -->
    <button
      type="button"
      (click)="toggleSidebar()"
      class="text-primary-800 hover:bg-gray-100 p-2 rounded cursor-pointer transition-colors"
      aria-label="Toggle sidebar"
    >
      <i class="fas fa-bars"></i>
    </button>

    <i class="fas fa-shield-alt text-primary-800 text-lg sm:text-xl"></i>
    <span class="text-base sm:text-lg font-bold text-primary-800 hidden sm:inline">CCMS TPA Portal</span>
    
    <!-- Role Badge (visible on larger screens) -->
    <span 
      *ngIf="activeRole" 
      class="hidden lg:inline-block text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-100 text-gray-700 border border-gray-200 uppercase tracking-wide"
    >
      {{ activeRole.role_code }}
    </span>
  </div>

  <!-- Center: Quick Navigation Links (hidden on small screens) -->
  <!-- <ul class="hidden lg:flex items-center gap-4 ml-8">
    <li>
      <a href="#" class="text-gray-600 text-xs font-bold hover:text-gray-800 transition-colors">
        <i class="fas fa-clock me-1"></i> 8H Monitoring
      </a>
    </li>
    <li>
      <a href="#" class="text-gray-600 text-xs font-bold hover:text-gray-800 transition-colors">
        <i class="fas fa-procedures me-1"></i> LOS Monitoring
      </a>
    </li>
  </ul> -->

  <!-- Right: Role Switcher + User Info + Logout -->
  <div class="flex items-center gap-2 sm:gap-3">
    <!-- Role Switcher Dropdown (only if multiple roles) -->
    <div *ngIf="hasMultipleRoles()" class="relative role-dropdown-container">
      <select
        [(ngModel)]="activeRoleId"
        (change)="onRoleChange()"
        class="text-xs sm:text-sm px-2 sm:px-3 py-1.5 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
        aria-label="Select role"
      >
        <option *ngFor="let role of currentUser?.roles" [value]="role.role_id">
          {{ role.role_name }}
        </option>
      </select>
    </div>

    <!-- User Display -->
    <div class="text-right leading-tight hidden sm:block">
      <div class="font-bold text-xs sm:text-sm">{{ currentUser?.full_name || 'User' }}</div>
      <div class="text-gray-500 text-[0.65rem] sm:text-xs">Internal TPA</div>
    </div>

    <!-- Logout Button -->
    <button
      type="button"
      (click)="logout()"
      class="px-2 sm:px-3 py-1.5 text-xs sm:text-sm text-red-600 hover:text-red-700 border border-red-600 hover:border-red-700 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-red-500"
      title="Logout"
    >
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </div>
</nav>
