<!-- Left Sidebar - Dark Theme Mockup Style -->
<aside
  [class.w-60]="isOpen"
  [class.w-[70px]]="!isOpen"
  class="fixed left-0 top-[60px] h-[calc(100vh-60px)] bg-[#1e293b] text-white transition-all duration-300 ease-in-out overflow-y-auto z-[1045] border-r border-[#334155]"
>
  <!-- Navigation -->
  <nav class="py-3">
    <div class="flex flex-col" *ngFor="let item of menuItems; trackBy: trackByMenuId">
      <!-- Menu Item without Children -->
      <a
        *ngIf="!item.children && item.id !== 'logout'"
        [routerLink]="item.route || '/dashboard'"
        routerLinkActive="!bg-blue-600 !text-white !border-l-4 !border-blue-400"
        [routerLinkActiveOptions]="{exact: false}"
        class="flex items-center gap-3 px-5 py-3 hover:bg-[#334155] transition-all whitespace-nowrap overflow-hidden text-xs font-medium text-gray-300"
      >
        <i [class]="'fas fa-' + item.icon + ' w-5 text-center text-sm'"></i>
        <span [class.hidden]="!isOpen" class="link-text">{{ item.label }}</span>
      </a>

      <!-- Logout Menu Item (with confirmation) -->
      <button
        *ngIf="!item.children && item.id === 'logout'"
        type="button"
        (click)="onMenuItemClick(item, $event)"
        class="flex items-center gap-3 px-5 py-3 hover:bg-red-600 transition-all whitespace-nowrap overflow-hidden text-xs font-medium text-gray-300 hover:text-white w-full text-left"
      >
        <i [class]="'fas fa-' + item.icon + ' w-5 text-center text-sm'"></i>
        <span [class.hidden]="!isOpen" class="link-text">{{ item.label }}</span>
      </button>

      <!-- Menu Item with Children (Categories) - Expanded Sidebar -->
      <button
        *ngIf="item.children && isOpen"
        type="button"
        (click)="toggleSubmenu(item)"
        class="flex items-center justify-between px-5 py-3 hover:bg-[#334155] transition-all text-gray-300 whitespace-nowrap overflow-hidden text-xs font-medium"
      >
        <div class="flex items-center gap-3">
          <i [class]="'fas fa-' + item.icon + ' w-5 text-center text-sm'"></i>
          <span class="link-text">{{ item.label }}</span>
        </div>
        <svg
          class="h-3 w-3 transition-transform"
          [class.rotate-180]="item.expanded"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Menu Item with Children (Categories) - Collapsed Sidebar -->
      <button
        *ngIf="item.children && !isOpen"
        type="button"
        (click)="toggleSubmenu(item)"
        [title]="item.label + ' (' + item.children.length + ' items)'"
        class="relative flex items-center justify-center py-3 hover:bg-[#334155] transition-all text-gray-300 w-full"
      >
        <i [class]="'fas fa-' + item.icon + ' w-5 text-center text-sm'"></i>
        <!-- Expand/Collapse indicator badge -->
        <svg
          class="absolute top-1 right-2 h-2.5 w-2.5 transition-transform"
          [class.rotate-180]="item.expanded"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>

      <!-- Submenu Items - Expanded sidebar -->
      <div *ngIf="item.children && item.expanded && isOpen" class="bg-[#0f172a]">
        <a
          *ngFor="let child of item.children; trackBy: trackByMenuId"
          [routerLink]="child.route || '/dashboard'"
          routerLinkActive="!bg-blue-600 !text-white !border-l-4 !border-blue-400"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex items-center gap-3 px-12 py-2 hover:bg-[#334155] transition-all text-xs text-gray-400"
        >
          <i [class]="'fas fa-' + child.icon + ' w-4 text-center text-xs'"></i>
          <span>{{ child.label }}</span>
        </a>
      </div>

      <!-- Submenu Items - Collapsed sidebar (show icons only when expanded) -->
      <div *ngIf="item.children && !isOpen && item.expanded" class="flex flex-col bg-[#0f172a]">
        <a
          *ngFor="let child of item.children; trackBy: trackByMenuId"
          [routerLink]="child.route || '/dashboard'"
          routerLinkActive="!bg-blue-600 !text-white"
          [routerLinkActiveOptions]="{exact: false}"
          [title]="child.label"
          class="flex items-center justify-center py-3 hover:bg-[#334155] transition-all text-gray-400"
        >
          <i [class]="'fas fa-' + child.icon + ' w-5 text-center text-xs'"></i>
        </a>
      </div>
    </div>
  </nav>
</aside>
