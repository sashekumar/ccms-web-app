<div class="min-h-screen flex items-center justify-center px-5" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
  <div class="w-full max-w-[400px]">
    <!-- Login Card -->
    <div class="bg-white rounded-xl shadow-2xl p-10">
      <!-- Logo/Shield Icon -->
      <div class="text-center mb-6">
        <i class="fas fa-shield-alt text-primary-800 text-5xl mb-2"></i>
        <h1 class="text-3xl font-bold mt-2" style="color: #1e3c72;">CCMS TPA</h1>
        <p class="text-gray-500 text-sm">Unified Claims Platform</p>
      </div>

      <!-- Error Alert -->
      <app-alert
        *ngIf="showError"
        type="error"
        title="Login Failed"
        [dismissible]="true"
        (closed)="onErrorClose()"
      >
        {{ errorMessage }}
      </app-alert>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-3">
        <!-- Username Field -->
        <div class="space-y-1">
          <label class="block text-sm font-medium text-gray-700">Username</label>
          <input
            type="text"
            formControlName="username"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            placeholder="Enter your username"
          />
          <p *ngIf="getFieldError('username')" class="text-xs text-red-600">{{ getFieldError('username') }}</p>
        </div>

        <!-- Password Field -->
        <div class="space-y-1">
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input
            type="password"
            formControlName="password"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
            placeholder="Enter your password"
          />
          <p *ngIf="getFieldError('password')" class="text-xs text-red-600">{{ getFieldError('password') }}</p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed mt-4"
        >
          {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

    </div>
  </div>
</div>
