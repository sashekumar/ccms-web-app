<div class="min-h-screen bg-gray-50 p-6">
  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Category Management</h1>
      <p class="mt-1 text-sm text-gray-600">Manage module categories and their organization</p>
    </div>
    <app-button 
      variant="primary"
      size="md"
      iconLeft="fas fa-plus"
      (click)="openCreateModal()">
      Create Category
    </app-button>
  </div>

  <!-- Data Table -->
  <app-data-table
    [rows]="getPaginatedData()"
    [columns]="columns"
    [rowActions]="rowActions"
    [filters]="tableFilters"
    [pagination]="pagination"
    [loading]="loading"
    emptyMessage="No categories found"
    emptySubMessage="Get started by creating a new category."
    (filterChange)="onFilterChange($event)"
    (rowAction)="onRowAction($event)"
    (cellToggle)="onToggleStatus($event)"
  ></app-data-table>
</div>

<!-- Create/Edit Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black bg-opacity-50 p-4" (click)="closeModal()">
  <div class="w-full max-w-lg max-h-[90vh] flex flex-col rounded-lg bg-white shadow-xl" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="flex-shrink-0 border-b border-gray-200 px-6 py-4">
        <h3 class="text-lg font-medium text-gray-900">
          {{ editingCategory ? 'Edit Category' : 'Create Category' }}
        </h3>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <form id="categoryForm" #categoryFormRef="ngForm" (ngSubmit)="saveCategory()">
          <div class="space-y-4">
            <app-text-input
              label="Category Name"
              [(ngModel)]="formData.categoryName"
              name="name"
              [required]="true"
              placeholder="Enter category name">
            </app-text-input>

            <app-text-input
              label="Category Code"
              [(ngModel)]="formData.categoryCode"
              name="code"
              [required]="true"
              placeholder="e.g., CLAIMS, MEMBERS"
              hint="Unique identifier">
            </app-text-input>

            <app-text-area
              label="Description"
              [(ngModel)]="formData.description"
              name="description"
              [rows]="2"
              placeholder="Optional description">
            </app-text-area>

            <app-text-input
              label="Icon"
              [(ngModel)]="formData.icon"
              name="icon"
              placeholder="e.g., file-medical-alt"
              hint="FontAwesome icon name">
            </app-text-input>

            <app-text-input
              label="Display Order"
              inputType="integer"
              [(ngModel)]="formData.displayOrder"
              name="order"
              [required]="true"
              placeholder="e.g., 10, 20, 30"
              hint="Lower numbers appear first">
            </app-text-input>

            <app-checkbox
              label="Active"
              [(ngModel)]="formData.isActive"
              name="active"
              labelSize="sm">
            </app-checkbox>
          </div>
        </form>
      </div>

    <!-- Modal Footer -->
    <div class="flex-shrink-0 border-t border-gray-200 px-6 py-4">
      <div class="flex gap-3 justify-end">
        <app-button
          variant="secondary"
          size="md"
          type="button"
          [disabled]="saving"
          (click)="closeModal()">
          Cancel
        </app-button>
        <app-button
          variant="primary"
          size="md"
          type="submit"
          form="categoryForm"
          [disabled]="saving || !categoryFormRef.valid"
          [loading]="saving">
          {{ editingCategory ? 'Update' : 'Create' }}
        </app-button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="showDeleteConfirm"
  title="Delete Category"
  [message]="'Are you sure you want to delete &quot;' + categoryToDelete?.category_name + '&quot;? Modules in this category will become uncategorized. This action cannot be undone.'"
  variant="danger"
  confirmLabel="Delete"
  cancelLabel="Cancel"
  (confirmed)="deleteCategory()"
  (cancelled)="cancelDelete()"
></app-confirm-dialog>

<!-- Status Toggle Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="showToggleConfirm"
  [title]="pendingToggle?.newValue ? 'Activate Category' : 'Deactivate Category'"
  [message]="pendingToggle?.newValue
    ? 'Are you sure you want to activate &quot;' + pendingToggle?.category?.category_name + '&quot;?'
    : 'Are you sure you want to deactivate &quot;' + pendingToggle?.category?.category_name + '&quot;?'"
  [variant]="pendingToggle?.newValue ? 'primary' : 'warn'"
  [confirmLabel]="pendingToggle?.newValue ? 'Yes, Activate' : 'Yes, Deactivate'"
  cancelLabel="Cancel"
  (confirmed)="confirmToggleStatus()"
  (cancelled)="cancelToggleStatus()"
></app-confirm-dialog>
