<div class="w-full">
  <!-- Label & Hint -->
  <label *ngIf="label" class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }}
    <span *ngIf="required" class="text-red-500 ml-0.5">*</span>
  </label>
  <p *ngIf="hint" class="text-gray-500 text-xs mb-3">{{ hint }}</p>

  <!-- Drag-drop Zone -->
  <div
    class="relative border-2 border-dashed rounded-lg p-6 transition-all duration-200"
    [class.border-blue-300]="!isDraggingOver"
    [class.bg-blue-50]="!isDraggingOver"
    [class.border-blue-500]="isDraggingOver"
    [class.bg-blue-100]="isDraggingOver"
    [class.opacity-50]="disabled"
    [class.cursor-not-allowed]="disabled"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input
      type="file"
      #fileInput
      hidden
      [multiple]="multiple"
      [accept]="acceptedFileTypes"
      [disabled]="disabled"
      (change)="onFileSelected($event)"
    />

    <!-- Drop zone content -->
    <div class="flex flex-col items-center justify-center py-6">
      <!-- Cloud upload icon -->
      <svg
        class="w-12 h-12 text-blue-400 mb-3"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
        />
      </svg>

      <!-- Text -->
      <p class="text-center text-gray-700 font-medium mb-1">
        Drag files here or
        <button
          type="button"
          (click)="fileInput.click()"
          [disabled]="disabled"
          class="text-blue-600 hover:text-blue-700 font-semibold underline disabled:opacity-50 disabled:cursor-not-allowed"
        >
          browse
        </button>
      </p>

      <!-- Supported types & limits -->
      <p class="text-xs text-gray-500 text-center">
        <span class="block"
          >Supported:
          {{ allowedExtensions.join(', ').toUpperCase() }}
        </span>
        <span class="block">Max size: {{ formatBytes(maxFileSize) }}</span>
      </p>
    </div>
  </div>

  <!-- File List -->
  <div *ngIf="files.length > 0" class="mt-6 space-y-3">
    <!-- File item -->
    <div
      *ngFor="let file of files"
      [class]="
        'bg-white rounded-lg border shadow-sm p-4 animate-slideIn ' +
        (file.status === 'error'
          ? 'border-red-200 bg-red-50'
          : file.status === 'success'
            ? 'border-green-200 bg-green-50'
            : 'border-gray-200')
      "
    >
      <!-- File header: icon/preview + info + status -->
      <div class="flex gap-3 items-start">
        <!-- File thumbnail or icon -->
        <div class="flex-shrink-0">
          <img
            *ngIf="showPreview && file.preview"
            [src]="file.preview"
            [alt]="file.originalName"
            class="w-12 h-12 rounded object-cover"
          />
          <div
            *ngIf="!file.preview"
            class="w-12 h-12 rounded bg-gray-100 flex items-center justify-center text-lg"
          >
            <span *ngIf="isImageFile(file.file)">🖼️</span>
            <span *ngIf="!isImageFile(file.file)">📄</span>
          </div>
        </div>

        <!-- File info -->
        <div class="flex-1 min-w-0">
          <p
            class="text-sm font-medium text-gray-900 truncate"
            [title]="file.originalName"
          >
            {{ file.originalName }}
          </p>
          <p class="text-xs text-gray-500">
            {{ formatBytes(file.size) }}
          </p>

          <!-- Progress bar (uploading) -->
          <div
            *ngIf="file.status === 'uploading'"
            class="mt-2 w-full bg-gray-200 rounded-full h-2 overflow-hidden"
          >
            <div
              class="bg-gradient-to-r from-primary-800 to-primary-700 h-full transition-all duration-300"
              [style.width.%]="file.progress"
            ></div>
          </div>

          <!-- Error message -->
          <p
            *ngIf="file.status === 'error' && file.error"
            class="mt-2 text-xs text-red-600"
          >
            {{ file.error }}
          </p>
        </div>

        <!-- Status icon (only show for uploading and success states) -->
        <div class="flex-shrink-0 text-lg" *ngIf="file.status !== 'error'">
          {{ getStatusIcon(file.status) }}
        </div>
      </div>

      <!-- Progress percentage and actions -->
      <div class="mt-3 flex items-center justify-between">
        <!-- Progress text -->
        <p *ngIf="file.status === 'uploading'" class="text-xs text-gray-600">
          {{ file.progress }}%
        </p>
        <div *ngIf="file.status !== 'uploading'" class="flex-1"></div>

        <!-- Action buttons -->
        <div class="flex gap-2">
          <button
            *ngIf="file.status === 'uploading'"
            type="button"
            (click)="cancelUpload(file)"
            class="px-3 py-1 text-xs bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition"
          >
            Cancel
          </button>

          <button
            *ngIf="file.status === 'error'"
            type="button"
            (click)="retryUpload(file)"
            class="px-3 py-1 text-xs bg-yellow-100 text-yellow-700 rounded hover:bg-yellow-200 transition"
          >
            Retry
          </button>

          <button
            *ngIf="file.status === 'success'"
            type="button"
            (click)="downloadFile(file)"
            class="px-3 py-1 text-xs bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition"
          >
            Download
          </button>

          <button
            type="button"
            (click)="removeFile(file)"
            class="px-3 py-1 text-xs bg-red-100 text-red-700 rounded hover:bg-red-200 transition"
          >
            Remove
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state hint -->
  <p *ngIf="files.length === 0" class="mt-3 text-xs text-gray-400 text-center">
    No files uploaded yet
  </p>
</div>
